# Cairn Supabase yerel geliştirme yapılandırması.
#
# Yerel çalıştırma (supabase start / supabase test db) Docker gerektirir.
# Docker kurulu değilse pgTAP testleri CI üzerinde koşar; bkz.
# .github/workflows/ci.yml -> database işi.

project_id = "cairn"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[storage]
enabled = true
# Belge boyutu sınırı; bucket seviyesindeki sınır 0008_storage.sql içinde ayrıca tanımlıdır.
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "cairn://"
additional_redirect_urls = ["cairn://", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Şifre zorunlu değildir: giriş e-posta magic-link ile yapılır (Faz 03).
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Magic-link akışı: şifre kaydı kapalıdır.
double_confirm_changes = true

[analytics]
enabled = false
